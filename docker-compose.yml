# Local backend stack (backlog P0.2-BE-03). Start with ./scripts/setup.sh the first time, then `make up`.
# Values like ${DB_PASSWORD} come from .env next to this file.
name: pluto-erp

x-app: &app
  image: pluto-erp-app:${APP_TARGET:-dev}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: ${APP_TARGET:-dev}
    args:
      UID: ${LOCAL_UID:-1000}
      GID: ${LOCAL_GID:-1000}
  env_file: .env
  volumes:
    - ./:/var/www/html
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0.44
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_ALL_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      - --default-time-zone=+00:00
      # Lets the app user create the posting immutability triggers (P4.1) while binary logging is on.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-ledgerflow}
      MYSQL_USER: ${DB_USERNAME:-ledgerflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    restart: unless-stopped
    healthcheck:
      # TCP on 127.0.0.1 so the temporary init server (no networking) is not reported healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  # cloudflared (live profile) is added in P0.4-BE-01.

volumes:
  mysql-data:
  redis-data:
