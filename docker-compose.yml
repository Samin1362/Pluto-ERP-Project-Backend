# Local backend stack (backlog P0.2-BE-03). Start with ./scripts/setup.sh the first time, then `make up`.
# Values like ${DB_PASSWORD} come from .env next to this file.
name: pluto-erp

x-app: &app
  image: pluto-erp-app:${APP_TARGET:-dev}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: ${APP_TARGET:-dev}
    args:
      UID: ${LOCAL_UID:-1000}
      GID: ${LOCAL_GID:-1000}
  env_file: .env
  volumes:
    - ./:/var/www/html
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0.44
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_ALL_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      - --default-time-zone=+00:00
      # Lets the app user create the posting immutability triggers (P4.1) while binary logging is on.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-ledgerflow}
      MYSQL_USER: ${DB_USERNAME:-ledgerflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    restart: unless-stopped
    healthcheck:
      # TCP on 127.0.0.1 so the temporary init server (no networking) is not reported healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  # Disposable API for the frontend's end-to-end tests (backlog P0.5-BE-01): `--profile e2e`, port 8081, own
  # database, Redis databases and config cache, so E2E runs never touch dev data. Prepared by scripts/e2e-prepare.sh.
  app-e2e:
    <<: *app
    environment:
      DB_DATABASE: ledgerflow_e2e
      REDIS_DB: "2"
      REDIS_CACHE_DB: "3"
      CACHE_PREFIX: ledgerflow-e2e-
      QUEUE_CONNECTION: sync
      APP_URL: http://localhost:8081
      APP_CONFIG_CACHE: /tmp/e2e-config.php
      APP_ROUTES_CACHE: /tmp/e2e-routes.php
      AUTH_RATE_LIMIT_PER_IP: "600"
      API_RATE_LIMIT_PER_USER: "6000"
      LEDGERFLOW_ALLOWED_ORIGINS: http://localhost:4173
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["e2e"]

  nginx-e2e:
    image: nginx:1.28.0-alpine
    # Same config as nginx, pointed at app-e2e.
    command: ["sh", "-c", "sed 's/set $$php_upstream app:9000/set $$php_upstream app-e2e:9000/' /etc/nginx/app.conf > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "${E2E_HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/app.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app-e2e:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["e2e"]

  # Public https://<random>.trycloudflare.com URL for nginx (backlog P0.4-BE-01). Only with `--profile live`;
  # read the URL with ./scripts/tunnel-url.sh. The URL changes only when this container restarts.
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["live"]

volumes:
  mysql-data:
  redis-data:
