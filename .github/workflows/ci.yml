# CI for the backend repo (Pluto-ERP-Project-Backend), backlog P0.8-BE-01. Four checks on every push to main and
# every pull request: docs in sync, PHPUnit on MySQL 8.0, code style, production image builds.
# Secrets: none needed; test keys and passwords are generated per run.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (generated files in sync)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate docs, contract, migrations and generated code (make docs, in Docker)
        run: ./scripts/docs.sh
      - name: Fail if anything generated was edited by hand or not regenerated
        run: git diff --exit-code

  backend:
    name: backend (PHPUnit on MySQL 8.0)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: pluto_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pluto_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, sodium, iconv, mbstring, intl, bcmath, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migrate, roll back, migrate again and seed
        run: |
          export APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          php artisan migrate --force && php artisan migrate:rollback --force && php artisan migrate --force && php artisan db:seed --force
          php artisan migrate:fresh --force
      - run: php vendor/bin/phpunit

  lint:
    name: lint (Laravel Pint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  docker:
    name: docker (production image builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -f docker/php/Dockerfile -t pluto-erp-app:ci .
      - name: Required PHP extensions are present
        run: docker run --rm pluto-erp-app:ci php -m | grep -qiE '^redis$' && docker run --rm pluto-erp-app:ci php -r 'foreach (["pdo_mysql","intl","bcmath","sodium","openssl","redis"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } } echo "ok\n";'
