# Nginx in front of PHP-FPM (backlog P0.2-BE-02). X-Forwarded-* headers from the tunnel/proxy pass through
# unchanged via fastcgi_params; the app decides whom to trust (P0.3-BE-02).
server {
    listen 80;
    # Docker's DNS, re-checked every 10 s: when deploy.sh recreates the app container (new IP), nginx follows it
    # instead of answering 502 until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }
}
